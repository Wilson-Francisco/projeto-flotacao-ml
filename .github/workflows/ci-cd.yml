name: Python CI 

# Roda em qualquer push ou pull request em qualquer branch do repositório
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  verify-code:
    runs-on: ubuntu-latest

    steps:
    # Faz o download do código do repositório para a máquina virtual do GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # Configura o ambiente Python na máquina virtual
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Versão estável do Python para projetos de ML

    # Cria um cache das bibliotecas para deixar as próximas execuções muito mais rápidas
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Instala as dependências listadas do requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  
        pip install -r requirements.txt

    # Verifica erros de sintaxe Python e padrões de código
    # Ignora avisos longos demais, mas trava o processo se houver erros graves de sintaxe
    - name: Lint with Flake8
      run: |
        # Para o build se houver erros de sintaxe Python ou undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Avisos de estilo não vão travar o CI por enquanto
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

   
    # Executa os testes automatizados da pasta src/tests/
    - name: Run tests with PyTest
      run: |
        pytest